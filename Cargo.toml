[package]
name = "retro-rs"
version = "0.6.1"
authors = ["Joseph C. Osborn <joseph.osborn@pomona.edu>"]
edition = "2024"
description = "A Rust front-end for libretro cores."
license = "Apache-2.0"
repository = "https://github.com/JoeOsborn/retro-rs"

[dependencies]
libloading = ">=0.8.9,<=0.9"
gisst-rust-libretro-sys = "0.4"
libc = "0.2"
euclid = {version="0.22", optional=true}
gl = {version="0.14", optional=true}

[target.'cfg( target_os = "linux" )'.dependencies]
surfman = {version="0.14",optional=true,features=["sm-x11"]}

[target.'cfg( not(target_os = "linux") )'.dependencies]
surfman = {version="0.14",optional=true}

[build-dependencies]
cc = "1.11"
syn = "3"

[dev-dependencies]
renderdoc = "0.12.1"

[features]
default = ["use_gl"]

use_gl = ["surfman", "euclid", "gl"]
